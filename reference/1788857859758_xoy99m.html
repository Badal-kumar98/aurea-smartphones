    function App() {
      const [view, setView] = useState('home'); // 'home', 'shop', 'product-detail', 'about', 'contact'
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isWishlistOpen, setIsWishlistOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [activeBrand, setActiveBrand] = useState('all');
      const [priceRange, setPriceRange] = useState(3000);
      const [sortBy, setSortBy] = useState('featured');
      const [notification, setNotification] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [discountCode, setDiscountCode] = useState('');
      const [appliedDiscount, setAppliedDiscount] = useState(0);

      // Trigger icons re-render on DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show toast notification
      const showToast = (message, type = 'gold') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3800);
      };

      // Cart management
      const addToCart = (product, color = null, storage = '512GB') => {
        const selectedColor = color || product.colors[0];
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id && item.selectedColor.name === selectedColor.name);
          if (existing) {
            return prev.map(item => item === existing ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1, selectedColor, selectedStorage: storage }];
        });
        showToast(`✨ Added "${product.name}" to your luxury cart`);
      };

      const removeFromCart = (index) => {
        setCart(prev => prev.filter((_, i) => i !== index));
        showToast('Item removed from cart', 'info');
      };

      const updateQuantity = (index, delta) => {
        setCart(prev => prev.map((item, i) => {
          if (i === index) {
            const newQ = item.quantity + delta;
            return newQ > 0 ? { ...item, quantity: newQ } : item;
          }
          return item;
        }));
      };

      // Wishlist toggle
      const toggleWishlist = (product) => {
        if (wishlist.some(item => item.id === product.id)) {
          setWishlist(prev => prev.filter(item => item.id !== product.id));
          showToast(`Removed from curated wishlist`, 'info');
        } else {
          setWishlist(prev => [...prev, product]);
          showToast(`💎 Added "${product.name}" to your Wishlist`);
        }
      };

      // Apply luxury promo code
      const handleApplyPromo = () => {
        if (discountCode.trim().toUpperCase() === 'AURUM10' || discountCode.trim().toUpperCase() === 'VIP') {
          setAppliedDiscount(0.10);
          showToast('⚜️ VIP Protocol Applied: 10% Royal Privilege Courtesy granted!');
        } else {
          showToast('Invalid VIP pass code. Try "AURUM10"', 'info');
        }
      };

      // Checkout simulation
      const handleCheckout = () => {
        if (cart.length === 0) return;
        if (window.confetti) {
          window.confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#D4AF37', '#FFF4BD', '#C5A059', '#1A1A1A']
          });
        }
        showToast('🎉 Order confirmed! Your Private Concierge is preparing your luxury shipment.');
        setCart([]);
        setIsCartOpen(false);
      };

      // Calculations
      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const discountAmount = subtotal * appliedDiscount;
      const finalTotal = subtotal - discountAmount;
      const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

      // Filtering logic
      const filteredProducts = useMemo(() => {
        return LUXURY_PRODUCTS.filter(item => {
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.edition.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
          const matchesBrand = activeBrand === 'all' || item.brand.toLowerCase() === activeBrand.toLowerCase();
          const matchesPrice = item.price <= priceRange;
          return matchesSearch && matchesCategory && matchesBrand && matchesPrice;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'rating') return b.rating - a.rating;
          return 0; // default featured
        });
      }, [searchQuery, activeCategory, activeBrand, priceRange, sortBy]);

      const openProductDetail = (prod) => {
        setSelectedProduct(prod);
        setView('product-detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col bg-pearl text-charcoal relative">
          
          {/* Toast Notification */}
          {notification && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-4 rounded-xl glass-panel shadow-gold-glow border border-gold-400 bg-white/95 text-charcoal font-medium text-sm animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-gold-500 animate-ping" />
              <span>{notification.message}</span>
            </div>
