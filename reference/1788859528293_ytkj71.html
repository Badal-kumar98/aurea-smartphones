    // --- MAIN REACT APP ---
    function AurumMobileApp() {
      // Navigation states: 'home' | 'shop' | 'product' | 'compare' | 'wishlist' | 'cart' | 'offers' | 'about' | 'contact'
      const [currentRoute, setCurrentRoute] = useState('home');
      const [selectedProductSlug, setSelectedProductSlug] = useState('apple-iphone-16-pro-max');
      const [brandFilter, setBrandFilter] = useState('All');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('popular'); // 'popular' | 'price-asc' | 'price-desc' | 'rating'

      // Compare Array: up to 3 phones
      const [compareList, setCompareList] = useState(["aur-ip16pm", "aur-s24u"]);

      // Local storage backed Cart & Wishlist
      const [wishlist, setWishlist] = useState(() => {
        try {
          const saved = localStorage.getItem('aurum_wishlist');
          return saved ? JSON.parse(saved) : ["aur-ip16pm"];
        } catch(e) { return ["aur-ip16pm"]; }
      });

      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('aurum_cart');
          return saved ? JSON.parse(saved) : [
            { id: "aur-ip16pm", quantity: 1, selectedColor: "Desert Titanium", selectedStorage: "256GB" }
          ];
        } catch(e) {
          return [{ id: "aur-ip16pm", quantity: 1, selectedColor: "Desert Titanium", selectedStorage: "256GB" }];
        }
      });

      // UI Drawers & Modals
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
      const [checkoutSuccessOrder, setCheckoutSuccessOrder] = useState(null);
      const [isSearchModalOpen, setIsSearchModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Toast notification helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Sync Cart to LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem('aurum_cart', JSON.stringify(cart));
        } catch(e) {}
      }, [cart]);

      // Sync Wishlist to LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem('aurum_wishlist', JSON.stringify(wishlist));
        } catch(e) {}
      }, [wishlist]);

      // Scroll to top on route change
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentRoute, selectedProductSlug]);

      // Refresh Lucide icons whenever route or modals shift
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Cart helpers
      const addToCart = (product, color, storage) => {
        const pColor = color || product.colors[0].name;
        const pStorage = storage || product.storageOptions[0];
        
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id && item.selectedStorage === pStorage && item.selectedColor === pColor);
          if (existing) {
            return prev.map(item => item === existing ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { id: product.id, quantity: 1, selectedColor: pColor, selectedStorage: pStorage }];
        });
        showToast(`Added ${product.model} (${pStorage}) to your shopping bag.`);
      };

      const removeFromCart = (index) => {
        setCart(prev => prev.filter((_, idx) => idx !== index));
      };

      const updateCartQty = (index, delta) => {
        setCart(prev => {
          return prev.map((item, idx) => {
            if (idx === index) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const toggleWishlist = (id) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(x => x !== id));
          showToast("Item removed from your saved sanctuary.");
        } else {
          setWishlist([...wishlist, id]);
          showToast("Phone added to your private Wishlist.");
        }
      };

      const toggleCompare = (id) => {
        if (compareList.includes(id)) {
          setCompareList(compareList.filter(x => x !== id));
          showToast("Removed from comparison matrix.");
        } else {
          if (compareList.length >= 3) {
            showToast("Comparison limit reached (Max 3 devices side-by-side).");
            return;
          }
          setCompareList([...compareList, id]);
          showToast("Added to compare deck.");
        }
      };

      // Filtered products list for /shop
      const filteredProducts = useMemo(() => {
        return PRODUCTS.filter(p => {
          const matchBrand = brandFilter === "All" || p.brand.toLowerCase() === brandFilter.toLowerCase();
          const matchCategory = categoryFilter === "all" || p.category === categoryFilter;
          const matchSearch = p.model.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.processor.toLowerCase().includes(searchQuery.toLowerCase());
          return matchBrand && matchCategory && matchSearch;
        }).sort((a, b) => {
          if (sortBy === 'price-asc') return a.price - b.price;
          if (sortBy === 'price-desc') return b.price - a.price;

      // Tabs: 'specs' | 'offers' | 'box'
      const [activeTab, setActiveTab] = useState('specs');

      const handlePincodeCheck = (e) => {
        e.preventDefault();
        if (!pincode || pincode.length !== 6) {
          setPincodeStatus({ success: false, text: "Please enter a valid 6-digit Indian PIN code." });
          return;
        }
        setPincodeStatus("checking");
        setTimeout(() => {
          if (["110001", "400001", "560001", "500001", "600001", "700001", "400050", "560038"].includes(pincode)) {
            setPincodeStatus({
              success: true,
              text: `Express VIP Delivery by Tomorrow, 4:00 PM to PIN ${pincode}. Store pickup available at Bandra / Indiranagar.`
            });
          } else {
            setPincodeStatus({
              success: true,
              text: `Standard Insured Delivery within 2-3 business days to PIN ${pincode} via Bluedart Apex.`
            });
          }
        }, 600);
